# Runs the tests and builds every installer on Windows, macOS and Linux.
# Download them from the run's "Artifacts" section on GitHub:
#   KevCast-Windows : KevCast-Setup (choose Server/Player/Studio), KevCast-Server-Setup,
#                     KevCast Player and KevCast Studio (.exe and .msi)
#   KevCast-macOS   : KevCast-Server .pkg, KevCast Player and KevCast Studio .dmg
#   KevCast-Linux   : kevcast-server .deb, KevCast Player and KevCast Studio (.deb, .AppImage), x64 + arm64
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  installers:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false # unsigned builds; add signing certificates for production
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build KevCast Player and KevCast Studio
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --config electron-builder.player.yml --publish never
          npx electron-builder --config electron-builder.studio.yml --publish never

      - name: Build Windows installers (KevCast Setup + KevCast Server Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Build KevCast Server .deb (amd64 + arm64)
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build-deb.sh amd64
          packaging/linux/build-deb.sh arm64

      - name: Build KevCast Server .pkg (Apple silicon + Intel)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/build-pkg.sh arm64
          packaging/macos/build-pkg.sh x64

      - uses: actions/upload-artifact@v5
        with:
          name: KevCast-${{ matrix.name }}
          path: |
            packaging-out/*.exe
            packaging-out/*.deb
            packaging-out/*.pkg
            desktop/dist/*/*.exe
            desktop/dist/*/*.msi
            desktop/dist/*/*.dmg
            desktop/dist/*/*.AppImage
            desktop/dist/*/*.deb
          if-no-files-found: error
