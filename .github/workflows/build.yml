# Runs the tests and builds every installer on Windows, macOS and Linux.
# Download them from the run's "Artifacts" section on GitHub:
#   KevCast-Windows : KevCast-Setup (choose Server/Player/Studio), KevCast-Server-Setup,
#                     KevCast Player and KevCast Studio (.exe and .msi)
#   KevCast-macOS   : KevCast-Server .pkg, KevCast Player and KevCast Studio .dmg
#   KevCast-Linux   : kevcast-server .deb, KevCast Player and KevCast Studio (.deb, .AppImage), x64 + arm64
# Releases: Actions → Build → "Run workflow" on main with "release" ticked, or push a tag
# (git tag v1.2.3 && git push origin v1.2.3). Both publish a GitHub Release with every installer
# attached and the matching CHANGELOG.md section as release notes.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release for the version in package.json (creates the vX.Y.Z tag)
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm test

  installers:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false # unsigned builds; add signing certificates for production
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Build KevCast Player and KevCast Studio
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --config electron-builder.player.yml --publish never
          npx electron-builder --config electron-builder.studio.yml --publish never

      - name: Check the macOS apps are signed (unsigned apps show as "damaged")
        if: runner.os == 'macOS'
        run: |
          found=0
          for app in desktop/dist/*/mac*/*.app; do
            found=1
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier|Format"
          done
          [ "$found" = 1 ] || { echo "::error::No .app bundles found to check"; exit 1; }

      - name: Build Windows installers (KevCast Setup + KevCast Server Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Build KevCast Server .deb (amd64 + arm64)
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/build-deb.sh amd64
          bash packaging/linux/build-deb.sh arm64

      - name: Build KevCast Server .pkg (Apple silicon + Intel)
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/build-pkg.sh arm64
          bash packaging/macos/build-pkg.sh x64

      - uses: actions/upload-artifact@v7
        with:
          name: KevCast-${{ matrix.name }}
          path: |
            packaging-out/*.exe
            packaging-out/*.deb
            packaging-out/*.pkg
            desktop/dist/*/*.exe
            desktop/dist/*/*.msi
            desktop/dist/*/*.dmg
            desktop/dist/*/*.AppImage
            desktop/dist/*/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Work out the release tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if [ "v$version" != "$tag" ]; then
              echo "::error::Tag $tag does not match package.json version $version"
              exit 1
            fi
          else
            tag="v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Release $tag already exists. Bump the version in package.json first."
              exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing $tag from $GITHUB_SHA"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo ""
            echo "## Downloads"
            echo "| Install on | Windows | macOS | Linux / Raspberry Pi |"
            echo "|---|---|---|---|"
            echo "| Any Windows PC (choose Server, Player, Studio) | \`KevCast-Setup-*.exe\` | – | – |"
            echo "| The server (one per organisation) | \`KevCast-Server-Setup-*.exe\` | \`KevCast-Server-*-mac-*.pkg\` | \`kevcast-server_*.deb\` |"
            echo "| Each screen | \`KevCast-Player-*.exe\` / \`.msi\` | \`KevCast-Player-*.dmg\` | \`KevCast-Player-*.deb\` / \`.AppImage\` |"
            echo "| Admin PCs (optional) | \`KevCast-Studio-*.exe\` / \`.msi\` | \`KevCast-Studio-*.dmg\` | \`KevCast-Studio-*.deb\` / \`.AppImage\` |"
            echo ""
            echo "See the [installation guide](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/installation.md)."
          } >> release-notes.md
          cat release-notes.md
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: KevCast-*
          merge-multiple: true
      - name: Publish the GitHub Release
        run: |
          mapfile -t files < <(find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.pkg' -o -name '*.deb' -o -name '*.AppImage' \) | sort)
          printf '%s\n' "${files[@]}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$TAG" "${files[@]}" --title "KevCast $VERSION" --notes-file release-notes.md --verify-tag
          else
            # Creates the tag on exactly the commit these installers were built from.
            gh release create "$TAG" "${files[@]}" --title "KevCast $VERSION" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
