# Build:  npm run dist:studio   (run on Windows for .exe/.msi, on macOS for .dmg, on Linux for AppImage/.deb)
appId: com.kevcast.studio
productName: KevCast Studio
artifactName: KevCast-Studio-${version}-${os}-${arch}.${ext}
directories:
  output: dist/studio
  buildResources: build
extraMetadata:
  name: kevcast-studio
  main: studio/main.js
files:
  - package.json
  - common/**
  - studio/**
win:
  icon: build/studio.ico
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  runAfterFinish: true
msi:
  perMachine: true
  runAfterFinish: true
mac:
  # No Apple Developer certificate yet: sign ad hoc ("-"). An unsigned Apple-silicon app is reported
  # as "damaged" by macOS with no way to open it; an ad-hoc signed one gets the normal
  # "unidentified developer" warning with "Open Anyway" in System Settings → Privacy & Security.
  # Ad-hoc signing requires hardenedRuntime off. Replace with a Developer ID + notarization for production.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  icon: build/studio.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
linux:
  icon: build/studio.png
  category: Utility
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
publish: []
