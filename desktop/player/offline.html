<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>KevCast Player</title>
  <style>
    html, body { margin: 0; height: 100%; cursor: none; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e2e8f0;
      background: radial-gradient(circle at 30% 20%, #1e1b4b, #020617 70%); }
    .brand { font-size: 3vh; letter-spacing: .4em; text-transform: uppercase; color: #a5b4fc; font-weight: 700; }
    h1 { font-size: 5vh; margin: 3vh 0 1vh; }
    p { font-size: 2.4vh; color: #94a3b8; max-width: 70vw; }
    .spin { width: 5vh; height: 5vh; border: .5vh solid #334155; border-top-color: #a5b4fc; border-radius: 50%; animation: s 1s linear infinite; margin: 3vh; }
    @keyframes s { to { transform: rotate(360deg); } }
    kbd { background: #1e293b; padding: .2vh .8vh; border-radius: .6vh; }
  </style>
</head>
<body>
  <div class="brand">KevCast</div>
  <h1>Connecting to the server…</h1>
  <div class="spin"></div>
  <p id="msg"></p>
  <p>Retrying automatically. Press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>K</kbd> to choose a different server.</p>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('msg').textContent = `Server: ${q.get('server') || '?'}${q.get('error') ? ' — ' + q.get('error') : ''}`;
  </script>
</body>
</html>
