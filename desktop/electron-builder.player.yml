# Build:  npm run dist:player   (run on Windows for .exe/.msi, on macOS for .dmg, on Linux for AppImage/.deb)
appId: com.kevcast.player
productName: KevCast Player
artifactName: KevCast-Player-${version}-${os}-${arch}.${ext}
directories:
  output: dist/player
  buildResources: build
extraMetadata:
  name: kevcast-player
  main: player/main.js
files:
  - package.json
  - common/**
  - player/**
win:
  icon: build/player.ico
  target:
    - target: nsis
      arch: [x64]
    - target: msi        # for GPO / Intune / SCCM roll-out
      arch: [x64]
nsis:
  oneClick: true
  perMachine: true
  runAfterFinish: true
msi:
  perMachine: true
  runAfterFinish: true
mac:
  icon: build/player.png
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [x64, arm64]
linux:
  icon: build/player.png
  category: Utility
  target:
    - target: AppImage
      arch: [x64, arm64]   # arm64 = Raspberry Pi 4/5 with 64-bit Raspberry Pi OS
    - target: deb
      arch: [x64, arm64]
publish: []
